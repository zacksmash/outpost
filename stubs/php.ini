; Sandbox-friendly settings for Outpost instances.

display_errors = On
error_reporting = E_ALL
memory_limit = 512M
max_execution_time = 300
post_max_size = 256M
upload_max_filesize = 256M
date.timezone = UTC

; Code is bind-mounted from macOS and edited live; without immediate
; revalidation, changes appear not to apply for several seconds.
opcache.revalidate_freq = 0
